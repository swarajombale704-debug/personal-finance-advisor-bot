<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Finance AI</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #09001f, #170044, #26005c);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-icon {
            width: 58px;
            height: 58px;
            margin: auto;
            border-radius: 16px;
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 10px 35px rgba(124, 58, 237, 0.35);
        }

        .logo h1 {
            margin-top: 12px;
            font-size: 25px;
            font-weight: 800;
        }

        .logo p {
            margin-top: 6px;
            color: #a9a2bd;
            font-size: 13px;
        }

        .card {
            background: rgba(19, 12, 45, 0.88);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 25px 70px rgba(0,0,0,0.4);
            backdrop-filter: blur(18px);
        }

        .card h2 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #9e98b0;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #d9d4e5;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid #34295a;
            background: #100a27;
            color: white;
            outline: none;
            font-size: 14px;
            transition: 0.25s;
        }

        input:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139,92,246,0.12);
        }

        input::placeholder {
            color: #68617b;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            transition: 0.25s;
            box-shadow: 0 10px 25px rgba(124,58,237,0.25);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(124,58,237,0.4);
        }

        .register {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: #8f889f;
        }

        .register a {
            color: #b58aff;
            text-decoration: none;
            font-weight: 700;
        }

        .register a:hover {
            text-decoration: underline;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #69627c;
            font-size: 11px;
        }

        @media (max-width: 480px) {
            .card {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        <div class="logo-icon">₹</div>
        <h1>Finance AI</h1>
        <p>Personal Finance Advisor</p>
    </div>

    <div class="card">

        <h2>Welcome back</h2>
        <p class="subtitle">Login to manage your finances smarter.</p>

        <form method="POST">

            <div class="form-group">
                <label>Email Address</label>
                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label>Password</label>
                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit">
                Login to Finance AI
            </button>

        </form>

        <div class="register">
            Don't have an account?
            <a href="/register">Create account</a>
        </div>

    </div>

    <div class="footer">
        AI-powered personal finance management
    </div>

</div>

</body>
</html>
