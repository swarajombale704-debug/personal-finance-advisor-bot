<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Finance AI - History</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", sans-serif;
            background:
                radial-gradient(circle at 80% 10%, rgba(124, 58, 237, 0.18), transparent 30%),
                radial-gradient(circle at 10% 80%, rgba(91, 33, 182, 0.12), transparent 30%),
                #08070d;
            color: #f5f3ff;
            min-height: 100vh;
        }

        .app {
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR */

        .sidebar {
            width: 245px;
            background: rgba(13, 11, 21, 0.94);
            border-right: 1px solid rgba(255,255,255,0.07);
            padding: 28px 18px;
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 45px;
            padding-left: 10px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 0 25px rgba(139,92,246,.35);
        }

        .logo-text {
            font-size: 18px;
            font-weight: 800;
        }

        .nav-title {
            font-size: 11px;
            color: #777080;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 0 12px;
            margin-bottom: 12px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 13px;
            padding: 13px 14px;
            margin-bottom: 6px;
            border-radius: 12px;
            color: #9992a8;
            cursor: pointer;
            transition: .25s;
            font-size: 14px;
        }

        .nav-item:hover {
            background: rgba(139,92,246,.10);
            color: #ddd6fe;
            transform: translateX(3px);
        }

        .nav-item.active {
            background: linear-gradient(
                90deg,
                rgba(139,92,246,.22),
                rgba(139,92,246,.07)
            );
            color: #c4b5fd;
            border: 1px solid rgba(139,92,246,.18);
        }

        .nav-icon {
            width: 22px;
            text-align: center;
            font-size: 16px;
        }

        /* MAIN */

        .main {
            margin-left: 245px;
            width: calc(100% - 245px);
            padding: 42px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 38px;
        }

        .page-title {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -0.8px;
        }

        .page-subtitle {
            margin-top: 7px;
            color: #8d8799;
            font-size: 14px;
        }

        .back-btn {
            border: 1px solid rgba(139,92,246,.3);
            background: rgba(139,92,246,.08);
            color: #c4b5fd;
            padding: 11px 18px;
            border-radius: 12px;
            cursor: pointer;
            transition: .25s;
        }

        .back-btn:hover {
            background: rgba(139,92,246,.18);
            transform: translateY(-2px);
        }

        /* SUMMARY */

        .summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 30px;
        }

        .summary-card {
            background: linear-gradient(
                145deg,
                rgba(28,23,40,.9),
                rgba(17,14,25,.95)
            );
            border: 1px solid rgba(255,255,255,.07);
            border-radius: 18px;
            padding: 22px;
            position: relative;
            overflow: hidden;
        }

        .summary-card::after {
            content: "";
            position: absolute;
            width: 90px;
            height: 90px;
            background: rgba(139,92,246,.13);
            border-radius: 50%;
            right: -30px;
            top: -30px;
            filter: blur(5px);
        }

        .summary-label {
            color: #8d8799;
            font-size: 12px;
            margin-bottom: 9px;
        }

        .summary-value {
            font-size: 25px;
            font-weight: 800;
        }

        /* HISTORY */

        .history-container {
            background: rgba(16,13,23,.86);
            border: 1px solid rgba(255,255,255,.07);
            border-radius: 20px;
            padding: 25px;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
        }

        .history-header h2 {
            font-size: 18px;
        }

        .history-count {
            color: #9d8bc5;
            font-size: 13px;
        }

        .record {
            background: linear-gradient(
                145deg,
                rgba(30,25,43,.88),
                rgba(18,15,27,.95)
            );
            border: 1px solid rgba(255,255,255,.06);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 14px;
            transition: .25s;
        }

        .record:hover {
            border-color: rgba(139,92,246,.32);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0,0,0,.2);
        }

        .record-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .record-date {
            color: #8f889b;
            font-size: 12px;
        }

        .record-id {
            background: rgba(139,92,246,.12);
            color: #bca7ef;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 11px;
        }

        .record-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 18px;
        }

        .info-box {
            background: rgba(255,255,255,.025);
            border-radius: 12px;
            padding: 14px;
        }

        .info-label {
            color: #81798d;
            font-size: 11px;
            margin-bottom: 7px;
        }

        .info-value {
            font-size: 17px;
            font-weight: 700;
        }

        .income {
            color: #86efac;
        }

        .expense {
            color: #fca5a5;
        }

        .saving {
            color: #c4b5fd;
        }

        .goal {
            border-top: 1px solid rgba(255,255,255,.06);
            padding-top: 15px;
            color: #aaa2b7;
            font-size: 13px;
        }

        .goal strong {
            color: #ddd6fe;
        }

        .expense-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 13px;
        }

        .expense-tag {
            background: rgba(139,92,246,.08);
            border: 1px solid rgba(139,92,246,.14);
            padding: 7px 10px;
            border-radius: 8px;
            font-size: 11px;
            color: #b9aec9;
        }

        /* EMPTY */

        .empty {
            text-align: center;
            padding: 70px 20px;
            color: #777080;
        }

        .empty-icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .empty h3 {
            color: #c9c2d1;
            margin-bottom: 8px;
        }

        /* LOADING */

        .loading {
            text-align: center;
            padding: 60px;
            color: #958ca2;
        }

        .loader {
            width: 35px;
            height: 35px;
            border: 3px solid rgba(139,92,246,.15);
            border-top-color: #8b5cf6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: auto auto 15px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* RESPONSIVE */

        @media (max-width: 900px) {
            .sidebar {
                width: 210px;
            }

            .main {
                margin-left: 210px;
                width: calc(100% - 210px);
                padding: 25px;
            }

            .summary {
                grid-template-columns: 1fr;
            }

            .record-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 650px) {
            .sidebar {
                position: relative;
                width: 100%;
                height: auto;
                border-right: none;
                border-bottom: 1px solid rgba(255,255,255,.07);
            }

            .app {
                display: block;
            }

            .main {
                margin-left: 0;
                width: 100%;
                padding: 20px;
            }

            .logo {
                margin-bottom: 20px;
            }

            .nav {
                display: flex;
                overflow-x: auto;
                gap: 5px;
            }

            .nav-title {
                display: none;
            }

            .nav-item {
                white-space: nowrap;
            }

            .topbar {
                align-items: flex-start;
                gap: 15px;
            }

            .page-title {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">
            <div class="logo-icon">₹</div>
            <div class="logo-text">Finance AI</div>
        </div>

        <div class="nav-title">Workspace</div>

        <div class="nav">

            <div class="nav-item" onclick="goDashboard()">
                <span class="nav-icon">⌂</span>
                Dashboard
            </div>

            <div class="nav-item" onclick="goDashboard()">
                <span class="nav-icon">✦</span>
                AI Analyse
            </div>

            <div class="nav-item" onclick="goDashboard()">
                <span class="nav-icon">◫</span>
                Budget
            </div>

            <div class="nav-item" onclick="goDashboard()">
                <span class="nav-icon">◎</span>
                Goals
            </div>

            <div class="nav-item active">
                <span class="nav-icon">◷</span>
                History
            </div>

        </div>

    </aside>


    <!-- MAIN -->

    <main class="main">

        <div class="topbar">

            <div>
                <div class="page-title">Financial History</div>
                <div class="page-subtitle">
                    Track your previous financial analyses and spending records.
                </div>
            </div>

            <button class="back-btn" onclick="goDashboard()">
                ← Dashboard
            </button>

        </div>


        <!-- SUMMARY -->

        <div class="summary">

            <div class="summary-card">
                <div class="summary-label">Total Records</div>
                <div class="summary-value" id="totalRecords">0</div>
            </div>

            <div class="summary-card">
                <div class="summary-label">Latest Income</div>
                <div class="summary-value income" id="latestIncome">₹0</div>
            </div>

            <div class="summary-card">
                <div class="summary-label">Latest Savings</div>
                <div class="summary-value saving" id="latestSaving">₹0</div>
            </div>

        </div>


        <!-- HISTORY -->

        <section class="history-container">

            <div class="history-header">
                <h2>Analysis Records</h2>
                <span class="history-count" id="historyCount">
                    Loading...
                </span>
            </div>

            <div id="historyList">

                <div class="loading">
                    <div class="loader"></div>
                    Loading financial history...
                </div>

            </div>

        </section>

    </main>

</div>


<script>

    function goDashboard() {
        window.location.href = "/";
    }


    function formatMoney(value) {
        return "₹" + Number(value || 0).toLocaleString("en-IN", {
            maximumFractionDigits: 0
        });
    }


    function escapeHtml(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    async function loadHistory() {

        const historyList = document.getElementById("historyList");

        try {

            const response = await fetch("/history");

            if (!response.ok) {
                throw new Error("Unable to load history");
            }

            const records = await response.json();

            document.getElementById("totalRecords").textContent =
                records.length;

            document.getElementById("historyCount").textContent =
                records.length + (records.length === 1 ? " record" : " records");


            if (records.length === 0) {

                historyList.innerHTML = `
                    <div class="empty">
                        <div class="empty-icon">◷</div>
                        <h3>No financial history yet</h3>
                        <p>Run your first AI financial analysis to see it here.</p>
                    </div>
                `;

                return;
            }


            const latest = records[0];

            const latestIncome = Number(latest.income || 0);
            const latestExpenses = Number(latest.total_expenses || 0);
            const latestSaving = latestIncome - latestExpenses;

            document.getElementById("latestIncome").textContent =
                formatMoney(latestIncome);

            document.getElementById("latestSaving").textContent =
                formatMoney(latestSaving);


            historyList.innerHTML = records.map(record => {

                const income = Number(record.income || 0);
                const expenses = Number(record.total_expenses || 0);
                const savings = income - expenses;

                const expenseItems = Object.entries(record.expenses || {})
                    .map(([category, amount]) => `
                        <div class="expense-tag">
                            ${escapeHtml(category)}
                            : ${formatMoney(amount)}
                        </div>
                    `)
                    .join("");


                return `

                    <div class="record">

                        <div class="record-top">

                            <div class="record-date">
                                ${escapeHtml(record.created_at)}
                            </div>

                            <div class="record-id">
                                Analysis #${escapeHtml(record.id)}
                            </div>

                        </div>


                        <div class="record-grid">

                            <div class="info-box">

                                <div class="info-label">
                                    MONTHLY INCOME
                                </div>

                                <div class="info-value income">
                                    ${formatMoney(income)}
                                </div>

                            </div>


                            <div class="info-box">

                                <div class="info-label">
                                    TOTAL EXPENSES
                                </div>

                                <div class="info-value expense">
                                    ${formatMoney(expenses)}
                                </div>

                            </div>


                            <div class="info-box">

                                <div class="info-label">
                                    REMAINING
                                </div>

                                <div class="info-value saving">
                                    ${formatMoney(savings)}
                                </div>

                            </div>

                        </div>


                        <div class="goal">

                            <strong>Financial Goal:</strong>

                            ${record.goal
                                ? escapeHtml(record.goal)
                                : "No goal specified"
                            }

                        </div>


                        <div class="expense-list">

                            ${expenseItems || `
                                <div class="expense-tag">
                                    No expense details
                                </div>
                            `}

                        </div>

                    </div>

                `;

            }).join("");


        } catch (error) {

            console.error(error);

            historyList.innerHTML = `

                <div class="empty">

                    <div class="empty-icon">⚠</div>

                    <h3>Unable to load history</h3>

                    <p>
                        Make sure your Flask server is running.
                    </p>

                </div>

            `;

        }

    }


    loadHistory();

</script>

</body>
</html>
